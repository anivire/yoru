name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' | sed '/^🤖/d' > message.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if grep -q '[^[:space:]]' message.txt; then
            git tag -a "v$version" -F message.txt
          else
            git tag "v$version"
          fi
          git push origin "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: tag
    if: needs.tag.outputs.version
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.tag.outputs.version }}

  release:
    needs: [tag, image]
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Write release notes
        run: node .github/scripts/release-notes.mjs "$TAG" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag

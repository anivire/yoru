services:
  yoru:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        RELEASE_CHANNEL: ${RELEASE_CHANNEL:-stable}
    restart: unless-stopped
    ports:
      - "3000"
    volumes:
      - yoru-data:/data
    environment:
      APP_URL: ${APP_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ANIME365_TOKEN: ${ANIME365_TOKEN:-}
      KODIK_TOKEN: ${KODIK_TOKEN:-}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
      SHIKIMORI_CLIENT_ID: ${SHIKIMORI_CLIENT_ID:-}
      SHIKIMORI_CLIENT_SECRET: ${SHIKIMORI_CLIENT_SECRET:-}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      MAL_CLIENT_SECRET: ${MAL_CLIENT_SECRET:-}
      METADATA_SOURCE: ${METADATA_SOURCE:-jikan}
      GITHUB_REPO: ${GITHUB_REPO:-anivire/yoru}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JIKAN_URL: ${JIKAN_URL:-https://api.jikan.moe/v4}
      ANIME365_URL: ${ANIME365_URL:-}
      SHIKIMORI_URL: ${SHIKIMORI_URL:-}
      ANILIST_URL: ${ANILIST_URL:-}
      KITSU_URL: ${KITSU_URL:-}
      ANILIBRIA_URL: ${ANILIBRIA_URL:-}
      KODIK_URL: ${KODIK_URL:-}
      RELEASE_POLL_MINUTES: ${RELEASE_POLL_MINUTES:-5}
      SESSION_DAYS: ${SESSION_DAYS:-30}

volumes:
  yoru-data:

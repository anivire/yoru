<!doctype html>
<html lang="ru" data-theme="yoru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="yoru" />
    <title>yoru</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('yoru:appearance') || '{}')
        var d = document.documentElement
        if (t.theme) d.dataset.theme = t.theme
        var s = t.scheme || 'dark'
        var dark = s === 'dark' || (s === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        d.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
